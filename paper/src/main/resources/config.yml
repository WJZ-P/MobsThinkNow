enabled: true

coordination:
  enabled: true
  # Members without a live target inherit the squad's visible target on the main thread.
  share-targets: true
  prevent-friendly-fire: true
  formation-radius: 16.0
  minimum-members: 2
  # Matches the Fabric default and is clamped to 4..100.
  maximum-members: 20
  # A query only visits 3x3 cells and stops after this many raw candidates.
  raw-scan-limit: 64
  heartbeat-ticks: 5
  forming-timeout-ticks: 40
  briefing-ticks: 30
  deployment-timeout-ticks: 40
  reorganizing-ticks: 20
  emergency-distance: 8.0
  maximum-separation: 48.0
  target-memory-ticks: 100

identity:
  # Only unnamed mobs, or names previously owned by this plugin, are updated.
  show-intelligence-names: true

zombie:
  retreat:
    enabled: true
    minimum-intelligence: 1
    # Retreat after reaching this remaining-health fraction.
    health-threshold: 0.20
    # Also retreat after one hit removes this fraction of maximum health.
    heavy-hit-threshold: 0.30
    maximum-ticks: 100
    safe-distance: 5.0
    speed: 1.50
    # Damage observations are consumed once and never survive a config reload.
    damage-memory-ticks: 20
  weapon-tactics:
    enabled: true
    minimum-intelligence: 3
    # Sword and axe users orbit here while their real weapon cooldown is not ready.
    spacing-radius: 2.8
    movement-speed: 1.15
    repath-ticks: 6
    axe:
      minimum-intelligence: 6
      # A visible windup precedes every valid leap; blocked terrain falls back to a ground strike.
      windup-ticks: 8
      preparation-timeout-ticks: 30
      horizontal-speed: 0.34
      critical-damage-multiplier: 1.50
  shield-tactics:
    enabled: true
    minimum-intelligence: 4
    # Vanilla pathfinding approaches normally, then the shield state machine takes over inside this band.
    raise-distance: 6.0
    lower-distance: 7.5
    movement-speed: 1.10
    repath-ticks: 6
    guard:
      minimum-ticks: 12
      maximum-ticks: 28
    counter:
      # A real successful block keeps the shield raised for this many extra ticks before counterattacking.
      minimum-delay-ticks: 2
      maximum-delay-ticks: 4
      strike-window-ticks: 10
      block-signal-memory-ticks: 20
      block:
        # Paper exposes the use-item pose for mobs, while this plugin supplies the player-style damage resolution.
        minimum-use-ticks: 5
        # Normalized horizontal dot product: 0.0 means the front 180-degree hemisphere.
        minimum-facing-dot: 0.0
      # A frontal axe hit deals normal damage and keeps this guard from raising the shield again.
      axe-disable-seconds: 3.0

skeleton:
  crossbow:
    enabled: true
    minimum-intelligence: 3
    # Paper has no public API for installing the vanilla skeleton crossbow Goal, so the plugin drives a visible state machine.
    charge-ticks: 25
    aim:
      minimum-ticks: 4
      maximum-ticks: 10
    projectile-speed: 3.15
    projectile-spread: 2.0
    maximum-lead-ticks: 20.0
    gravity-per-tick-squared: 0.05
    firework:
      enabled: true
      minimum-intelligence: 7
      minimum-range: 6.0
      maximum-range: 30.0
      ally-danger-radius: 3.5
      maximum-ally-checks: 20
      projectile-speed: 1.6
      projectile-lifetime-ticks: 40
      # A single main-thread task updates at most this many managed bolts; excess shots fall back to arrows.
      maximum-active-projectiles: 48
      consume-ammunition: true
    natural-loadout:
      enabled: true
      # Same base chances as Fabric; world difficulty and persistent IQ adjust the effective roll.
      crossbow-chance: 0.18
      firework-crossbow-chance: 0.25
  spacing:
    enabled: true
    minimum-intelligence: 1
    # IQ adjusts this base range from 85% to 115%.
    preferred-range: 10.0
    # Emergency disengage is distinct from bow-ready kiting: the skeleton lowers its weapon and runs forward.
    maximum-disengage-ticks: 80
    timeout-cooldown-ticks: 20
  projectile-evasion:
    enabled: true
    minimum-intelligence: 4
    # One global main-thread index tracks arrows once; no skeleton scans the world's full entity list.
    maximum-tracked-projectiles: 256
    # Each activation query stops after this many raw candidates, even in an arrow storm.
    maximum-candidate-checks: 24
    scan-radius: 8.5
    dodge-distance: 3.25
    movement-speed: 1.35
    cooldown-ticks: 14
  cover-peeking:
    enabled: true
    minimum-intelligence: 5
    # Candidate geometry is scored by the shared kernel; only the best few plans reach Paper's pathfinder.
    search-radius: 4
    maximum-candidate-checks: 96
    maximum-path-checks: 4
    search-cooldown-ticks: 60
    movement-speed: 1.10
    hidden-wait:
      minimum-ticks: 4
      maximum-ticks: 8
    draw-ticks: 20
    maximum-shots-per-cover: 2
    cycle-timeout-ticks: 240
    target-movement-tolerance: 6.0
  coordinated-fire:
    enabled: true
    minimum-intelligence: 4
    maximum-range: 24.0
    charge-ticks: 16
    minimum-shot-interval-ticks: 28
    # Ally centers are tested against this capsule radius before every release.
    friendly-lane-radius: 0.75
    maximum-lane-checks: 20
    reposition-distance: 3.0

creeper:
  tactics:
    enabled: true
    minimum-intelligence: 1
    flanking: true
    maximum-fuse-start-distance: 4.0
    moving-fuse: true
    maximum-fuse-movement-speed: 1.25
    feint:
      # IQ 8+ creepers briefly prime outside the real fuse envelope when watched or shielded against.
      enabled: true
      # Shared planning hard-limits the visible fake prime to 6..8 ticks; this controls only reuse frequency.
      cooldown-ticks: 240
      reposition-speed: 1.16
  blast-reservation:
    # Nearby creepers reserve distinct blast windows instead of entering one clumped fuse race.
    conflict-radius: 6.0
    separation-ticks: 24
    lease-ticks: 40
    # A saturated 3x3 spatial query is conservatively treated as occupied; work never grows with mob count.
    maximum-checks: 32

spider:
  tactics:
    enabled: true
    minimum-intelligence: 1
    predictive-pounce: true
    hit-and-run: true
    # One O(1) target lease staggers spiders attacking the same victim.
    pounce-stagger-ticks: 10
    pounce-lease-ticks: 20
    maximum-air-ticks: 40
    # In MOUNTED_BREACH/COMBINED_ARMS squads a spider can carry an assigned creeper.
    mounted-breach: true
    maximum-carrier-speed: 1.35
    # Release the primed payload before detonation so the carrier has time to disengage.
    payload-release-progress: 0.35
    assembly-timeout-ticks: 100
    remount-cooldown-ticks: 100
