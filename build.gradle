plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	mods {
		"mobsthinknow" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mobsthinknow-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

def gameTestRuntimeDirectory = layout.buildDirectory.dir("run/gameTest")
tasks.named("runGameTest") {
	// Minecraft creates these files only after logging a scary first-run error. Seed the isolated build directory
	// before launch so a clean verification has no false-negative ERROR/WARN noise.
	doFirst {
		File gameTestDirectory = gameTestRuntimeDirectory.get().asFile
		gameTestDirectory.mkdirs()
		File properties = new File(gameTestDirectory, "server.properties")
		if (!properties.exists()) {
			properties.setText("online-mode=false\n", "UTF-8")
		}
		File eula = new File(gameTestDirectory, "eula.txt")
		if (!eula.exists()) {
			eula.setText("eula=true\n", "UTF-8")
		}
	}
}

dependencies {
	// 共享内核会由 jar 任务直接合入成品；只进入编译、本地运行和测试类路径，不作为外部 Maven 依赖发布。
	compileOnly project(":shared")
	localRuntime project(":shared")
	testImplementation project(":shared")

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 26.x 依赖已经使用 Mojang 映射发布。compileOnly 供客户端配置类编译，
	// localRuntime 只进开发客户端运行时；两者都不进 JUnit 测试类路径——否则
	// fabric-loader-junit 会在单元测试环境里尝试解析这两个客户端 Mod 的依赖并失败。
	// 生产环境中只在需要客户端配置页面时安装，不会被打进本 Mod JAR。
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// 只放进开发客户端的运行环境，用于调试光影；不会成为本 Mod 的发布依赖或打进成品 JAR。
	// Iris 的 Fabric 版本要求 Sodium，因此两者必须使用同一 Minecraft 版本的配套构建。
	localRuntime "maven.modrinth:iris:${project.iris_version}"
	localRuntime "maven.modrinth:sodium:${project.sodium_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

def resourceVersion = project.version

processResources {
	inputs.property "version", resourceVersion

	filesMatching("fabric.mod.json") {
		expand "version": resourceVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = "UTF-8"
	options.compilerArgs.addAll(["-Xlint:all", "-Xlint:-processing", "-Xlint:-serial", "-Xlint:-classfile", "-Werror"])
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

tasks.named("test", Test) {
	// fabric-loader-junit 把工作目录当作 gameDir 并扫描其中的 mods/ 文件夹；项目根目录的
	// mods/ 只服务于开发客户端（小地图等辅助 Mod，可能带 kotlin 等额外依赖），
	// 绝不能进入单元测试的 Mod 解析。给测试一个干净的独立工作目录。
	File junitWorkingDir = file("build/junit-run")
	workingDir = junitWorkingDir
	doFirst {
		junitWorkingDir.mkdirs()
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

def rootProjectName = project.name
evaluationDependsOn(":shared")

jar {
	// 共享模块只包含平台无关的纯 Java 决策类，直接合入 Fabric 成品，避免玩家安装第二个前置。
	duplicatesStrategy = DuplicatesStrategy.FAIL
	from(project(":shared").sourceSets.main.output)
	from("LICENSE") {
		rename { "${it}_${rootProjectName}" }
	}
}

tasks.named("sourcesJar", Jar) {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	from(project(":shared").sourceSets.main.allSource)
	from("LICENSE") {
		rename { "${it}_${rootProjectName}" }
	}
}

def fabricJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
def sharedBinaryJar = project(":shared").tasks.named("jar", Jar).flatMap { it.archiveFile }
def fabricSourcesJar = tasks.named("sourcesJar", Jar).flatMap { it.archiveFile }
def sharedSourcesJar = project(":shared").tasks.named("sourcesJar", Jar).flatMap { it.archiveFile }
def rootLicense = file("LICENSE")
def expectedFabricDependencies = [
	"fabricloader": ">=${project.loader_version}",
	"minecraft": "~${project.minecraft_version}",
	"java": ">=25",
	"fabric-api": ">=${project.fabric_api_version.toString().split('\\+')[0]}"
]
def expectedFabricSuggestions = [
	"modmenu": ">=${project.modmenu_version}",
	"cloth-config": ">=${project.cloth_config_version}"
]
tasks.register("verifyBundledSharedClasses") {
	group = "verification"
	description = "Verify the distributable Fabric archives contain the platform-neutral shared kernel."
	dependsOn(tasks.named("jar"))
	dependsOn(tasks.named("sourcesJar"))
	dependsOn(project(":shared").tasks.named("jar"))
	dependsOn(project(":shared").tasks.named("sourcesJar"))
	inputs.file(fabricJar)
	inputs.file(sharedBinaryJar)
	inputs.file(fabricSourcesJar)
	inputs.file(sharedSourcesJar)
	inputs.file(rootLicense)
	doLast {
		new java.util.zip.ZipFile(sharedBinaryJar.get().asFile).withCloseable { sharedArchive ->
			def required = sharedArchive.entries().findAll {
				!it.directory && it.name.startsWith("com/wjz/mobsthinknow/shared/") && it.name.endsWith(".class")
			}*.name
			if (required.isEmpty()) {
				throw new GradleException("Shared binary jar contains no shared classes")
			}
			new java.util.zip.ZipFile(fabricJar.get().asFile).withCloseable { archive ->
				required.addAll([
					"fabric.mod.json",
					"mobsthinknow.mixins.json",
					"LICENSE_MobsThinkNow",
					"com/wjz/mobsthinknow/MobsThinkNow.class",
					"com/wjz/mobsthinknow/client/MobsThinkNowModMenu.class"
				])
				def missing = required.findAll { archive.getEntry(it) == null }
				if (!missing.isEmpty()) {
					throw new GradleException("Fabric jar is missing required release entries: ${missing.join(', ')}")
				}
				def names = archive.entries().findAll { !it.directory }*.name
				if (names.size() != names.toSet().size()) {
					throw new GradleException("Fabric jar contains duplicate ZIP entries")
				}
				if (!java.util.Arrays.equals(
					archive.getInputStream(archive.getEntry("LICENSE_MobsThinkNow")).bytes,
					rootLicense.bytes
				)) {
					throw new GradleException("Fabric jar license content differs from repository LICENSE")
				}
				def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry("fabric.mod.json")))
				if (metadata.version != resourceVersion.toString()) {
					throw new GradleException(
						"fabric.mod.json version ${metadata.version} does not match project version ${resourceVersion}"
					)
				}
				if (metadata.id != "mobsthinknow"
					|| metadata.environment != "*"
					|| metadata.depends != expectedFabricDependencies
					|| metadata.suggests != expectedFabricSuggestions) {
					throw new GradleException("fabric.mod.json identity or dependency constraints differ from Gradle properties")
				}
				def entrypointClasses = metadata.entrypoints.values().flatten().collect {
					it instanceof Map ? it.value : it
				}.findAll { it instanceof String }.collect { it.replace('.', '/') + ".class" }
				def mixinConfig = new groovy.json.JsonSlurper().parse(
					archive.getInputStream(archive.getEntry("mobsthinknow.mixins.json"))
				)
				def mixinPackage = mixinConfig.package.replace('.', '/')
				def mixinClasses = ["mixins", "client", "server"].collectMany { section ->
					(mixinConfig[section] ?: []).collect { "${mixinPackage}/${it.replace('.', '/')}.class" }
				}
				def missingDeclaredClasses = (entrypointClasses + mixinClasses).findAll { archive.getEntry(it) == null }
				if (!missingDeclaredClasses.isEmpty()) {
					throw new GradleException(
						"Fabric metadata references missing classes: ${missingDeclaredClasses.join(', ')}"
					)
				}
				def paperLeak = archive.entries().find { it.name.startsWith("com/wjz/mobsthinknow/paper/") }
				if (paperLeak != null) {
					throw new GradleException("Fabric jar unexpectedly contains Paper class: ${paperLeak.name}")
				}
			}
		}
		new java.util.zip.ZipFile(sharedSourcesJar.get().asFile).withCloseable { sharedArchive ->
			def required = sharedArchive.entries().findAll {
				!it.directory && it.name.startsWith("com/wjz/mobsthinknow/shared/") && it.name.endsWith(".java")
			}*.name
			if (required.isEmpty()) {
				throw new GradleException("Shared sources jar contains no shared sources")
			}
			new java.util.zip.ZipFile(fabricSourcesJar.get().asFile).withCloseable { archive ->
				required.add("LICENSE_MobsThinkNow")
				def missing = required.findAll { archive.getEntry(it) == null }
				if (!missing.isEmpty()) {
					throw new GradleException("Fabric sources jar is missing shared sources: ${missing.join(', ')}")
				}
				def names = archive.entries().findAll { !it.directory }*.name
				if (names.size() != names.toSet().size()) {
					throw new GradleException("Fabric sources jar contains duplicate ZIP entries")
				}
				if (!java.util.Arrays.equals(
					archive.getInputStream(archive.getEntry("LICENSE_MobsThinkNow")).bytes,
					rootLicense.bytes
				)) {
					throw new GradleException("Fabric sources jar license differs from repository LICENSE")
				}
			}
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("verifyBundledSharedClasses"))
}

tasks.named("build") {
	// 根项目的 build 同时验证共享内核和 Paper 插件，避免只构建 Fabric 后误以为双端均可发布。
	dependsOn(":shared:build", ":paper:build")
}

def paperSmokeJava = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(25)
}
def paperSmokeScript = file("tools/paper_smoke_test.py")
def paperSmokeSelftestRuns = providers.gradleProperty("paperSmokeSelftestRuns").orElse("1")
def paperSmokeJfrOutput = providers.gradleProperty("paperSmokeJfrOutput").orElse("")
def paperSmokeRootDirectory = rootDir.absolutePath

tasks.register("paperSmokeTest", Exec) {
	group = "verification"
	description = "Build the plugin and verify it in pinned Paper 26.1.2 build 74."
	dependsOn(":paper:jar")
	workingDir = rootDir
	def paperJar = project(":paper").tasks.named("jar", Jar).flatMap { it.archiveFile }
	inputs.file(paperJar)
	inputs.property("javaLauncher", paperSmokeJava.map { it.metadata.installationPath.asFile.absolutePath })
	inputs.property("selftestRuns", paperSmokeSelftestRuns)
	inputs.property("jfrOutput", paperSmokeJfrOutput)
	doFirst {
		def defaultPython = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("windows")
			? "python"
			: "python3"
		def python = System.getenv("PYTHON") ?: defaultPython
		def arguments = [
			python,
			paperSmokeScript.absolutePath,
			"--plugin",
			paperJar.get().asFile.absolutePath,
			"--java",
			paperSmokeJava.get().executablePath.asFile.absolutePath,
			"--selftest-runs",
			paperSmokeSelftestRuns.get()
		]
		if (!paperSmokeJfrOutput.get().isBlank()) {
			arguments.addAll([
				"--jfr-output",
				new File(paperSmokeRootDirectory, paperSmokeJfrOutput.get()).absolutePath
			])
		}
		commandLine(arguments)
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

def publishedPom = layout.buildDirectory.file("publications/mavenJava/pom-default.xml")
def publishedModule = layout.buildDirectory.file("publications/mavenJava/module.json")
def publishedArtifactId = project.archives_base_name
def publishedGroup = project.group.toString()
def publishedVersion = project.version.toString()
def expectedRuntimeDependencies = [
	"net.fabricmc:fabric-loader": project.loader_version.toString(),
	"net.fabricmc.fabric-api:fabric-api": project.fabric_api_version.toString()
]
tasks.register("verifyPublicationMetadata") {
	group = "verification"
	description = "Verify shaded shared classes are not advertised as an unresolved external dependency."
	dependsOn(tasks.named("generatePomFileForMavenJavaPublication"))
	dependsOn(tasks.named("generateMetadataFileForMavenJavaPublication"))
	inputs.file(publishedPom)
	inputs.file(publishedModule)
	doLast {
		def pomText = publishedPom.get().asFile.getText("UTF-8")
		def moduleText = publishedModule.get().asFile.getText("UTF-8")
		def pom = new groovy.xml.XmlSlurper(false, false).parseText(pomText)
		if (pom.groupId.text() != publishedGroup
			|| pom.artifactId.text() != publishedArtifactId.toString()
			|| pom.version.text() != publishedVersion) {
			throw new GradleException("Published POM coordinates do not match the project coordinates")
		}
		def pomDependencies = pom.dependencies.dependency.collectEntries { dependency ->
			[("${dependency.groupId.text()}:${dependency.artifactId.text()}").toString(), [
				version: dependency.version.text(),
				scope: dependency.scope.text()
			]]
		}
		def expectedPomDependencies = expectedRuntimeDependencies.collectEntries { coordinate, dependencyVersion ->
			[coordinate, [version: dependencyVersion, scope: "runtime"]]
		}
		if (pomDependencies != expectedPomDependencies) {
			throw new GradleException("Published POM dependencies differ from the intended Fabric runtime set")
		}
		def module = new groovy.json.JsonSlurper().parseText(moduleText)
		if (module.component.group != publishedGroup
			|| module.component.module != publishedArtifactId.toString()
			|| module.component.version != publishedVersion) {
			throw new GradleException("Gradle Module Metadata coordinates do not match the project coordinates")
		}
		def runtimeVariant = module.variants.find { it.name == "runtimeElements" }
		def moduleDependencies = (runtimeVariant?.dependencies ?: []).collectEntries { dependency ->
			[("${dependency.group}:${dependency.module}").toString(), dependency.version.requires.toString()]
		}
		if (moduleDependencies != expectedRuntimeDependencies) {
			throw new GradleException("Gradle Module Metadata dependencies differ from the intended Fabric runtime set")
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("verifyPublicationMetadata"))
}

def localizationSources = fileTree("src/main/java") { include("**/*.java") }
def englishLanguage = file("src/main/resources/assets/mobsthinknow/lang/en_us.json")
def chineseLanguage = file("src/main/resources/assets/mobsthinknow/lang/zh_cn.json")
tasks.register("verifyLocalizationResources") {
	group = "verification"
	description = "Verify English and Chinese translation keys and every static code reference stay in sync."
	inputs.files(localizationSources, englishLanguage, chineseLanguage)
	doLast {
		def parseLanguage = { File language ->
			def raw = language.getText("UTF-8")
			def parsed = new groovy.json.JsonSlurper().parseText(raw)
			if (!(parsed instanceof Map)) {
				throw new GradleException("Language resource must be a JSON object: ${language.name}")
			}
			def declaredKeys = (raw =~ /(?m)^\s*"([^"]+)"\s*:/).collect { it[1] }
			if (declaredKeys.size() != parsed.size() || declaredKeys.toSet().size() != declaredKeys.size()) {
				throw new GradleException("Language resource contains duplicate keys: ${language.name}")
			}
			def invalidValues = parsed.findAll { key, value -> !(value instanceof String) || value.isBlank() }.keySet()
			if (!invalidValues.isEmpty()) {
				throw new GradleException("Language resource contains blank or non-string values: ${invalidValues}")
			}
			return parsed.keySet() as Set
		}
		def englishKeys = parseLanguage(englishLanguage)
		def chineseKeys = parseLanguage(chineseLanguage)
		if (englishKeys != chineseKeys) {
			throw new GradleException(
				"Translation key mismatch: missingChinese=${(englishKeys - chineseKeys).sort()}, "
					+ "missingEnglish=${(chineseKeys - englishKeys).sort()}"
			)
		}
		def referencedKeys = [] as Set
		localizationSources.files.each { source ->
			def matcher = source.getText("UTF-8") =~ /"([A-Za-z0-9_.-]*mobsthinknow\.[A-Za-z0-9_.-]+)"/
			referencedKeys.addAll(matcher.collect { it[1] }.findAll { !it.endsWith(".") })
		}
		def missingReferences = (referencedKeys - englishKeys).sort()
		if (!missingReferences.isEmpty()) {
			throw new GradleException("Code references missing translation keys: ${missingReferences}")
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("verifyLocalizationResources"))
}

def fabricConfigModelSource = file("src/main/java/com/wjz/mobsthinknow/config/MobsThinkNowConfig.java")
def fabricConfigScreenSource = file("src/main/java/com/wjz/mobsthinknow/client/MobsThinkNowConfigScreen.java")
tasks.register("verifyClientConfigCoverage") {
	group = "verification"
	description = "Verify every mutable Fabric configuration field is saved exactly once by the transactional client screen."
	inputs.files(fabricConfigModelSource, fabricConfigScreenSource)
	doLast {
		def model = fabricConfigModelSource.getText("UTF-8")
		def screen = fabricConfigScreenSource.getText("UTF-8")
		def fields = (model =~ /(?m)^\s*public\s+(?:boolean|int|double)\s+([a-z][A-Za-z0-9_]*)\s*=/)
			.collect { it[1] }
		def assignments = (screen =~ /updated\.([a-z][A-Za-z0-9_]*)\s*=/).collect { it[1] }
		def duplicateFields = fields.groupBy { it }.findAll { ignored, values -> values.size() > 1 }.keySet()
		def duplicateAssignments = assignments.groupBy { it }.findAll { ignored, values -> values.size() > 1 }.keySet()
		def fieldSet = fields as Set
		def assignmentSet = assignments as Set
		def missing = (fieldSet - assignmentSet).sort()
		def unknown = (assignmentSet - fieldSet).sort()
		def replacementCalls = (screen =~ /ConfigManager\.replace\(/).count
		if (!duplicateFields.isEmpty()
			|| !duplicateAssignments.isEmpty()
			|| !missing.isEmpty()
			|| !unknown.isEmpty()
			|| screen.contains("ConfigManager.update(")
			|| replacementCalls != 1) {
			throw new GradleException(
				"Client config coverage mismatch: duplicateFields=${duplicateFields.sort()}, "
					+ "duplicateAssignments=${duplicateAssignments.sort()}, missing=${missing}, unknown=${unknown}, "
					+ "replacementCalls=${replacementCalls}"
			)
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("verifyClientConfigCoverage"))
}

def documentationFiles = fileTree(rootDir) {
	include("**/*.md")
	exclude("**/build/**", ".gradle/**", ".git/**")
}
tasks.register("verifyDocumentationLinks") {
	group = "verification"
	description = "Verify every repository-local Markdown link resolves to an existing file."
	inputs.files(documentationFiles)
	doLast {
		def missing = []
		documentationFiles.files.each { document ->
			def matcher = document.getText("UTF-8") =~ /\[[^\]]*\]\(([^)]+)\)/
			matcher.each { match ->
				def rawTarget = match[1].trim().replaceFirst(/\s+["'][^"']*["']$/, "")
				def target = rawTarget.split("#", 2)[0]
				if (!target.isEmpty()
					&& !target.startsWith("#")
					&& !(target ==~ /(?i)^[a-z][a-z0-9+.-]*:.*/)) {
					def decoded = java.net.URLDecoder.decode(target, java.nio.charset.StandardCharsets.UTF_8)
					def linked = new File(document.parentFile, decoded)
					if (!linked.exists()) {
						missing.add("${rootDir.toPath().relativize(document.toPath())} -> ${rawTarget}")
					}
				}
			}
		}
		if (!missing.isEmpty()) {
			throw new GradleException("Broken local Markdown links: ${missing.sort().join(', ')}")
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("verifyDocumentationLinks"))
}

def gameTestSources = fileTree("src/gametest/java") { include("**/*.java") }
def gameTestMetadata = file("src/gametest/resources/fabric.mod.json")
tasks.register("verifyGameTestEntrypoints") {
	group = "verification"
	description = "Verify every class containing Fabric GameTests is registered exactly once."
	inputs.files(gameTestSources, gameTestMetadata)
	doLast {
		def metadata = new groovy.json.JsonSlurper().parse(gameTestMetadata)
		def declared = metadata.entrypoints?.get("fabric-gametest") ?: []
		def duplicates = declared.groupBy { it }.findAll { ignored, occurrences -> occurrences.size() > 1 }.keySet()
		def discovered = gameTestSources.files.findAll { source ->
			source.getText("UTF-8") =~ /@GameTest(?:\s*\(|\s*(?:\R|$))/
		}.collect { source ->
			def text = source.getText("UTF-8")
			def packageMatch = text =~ /(?m)^package\s+([A-Za-z0-9_.]+);\s*$/
			if (!packageMatch.find()) {
				throw new GradleException("GameTest source has no package declaration: ${source}")
			}
			return packageMatch.group(1) + "." + source.name.replaceFirst(/\.java$/, "")
		} as Set
		def declaredSet = declared as Set
		def missing = (discovered - declaredSet).sort()
		def stale = (declaredSet - discovered).sort()
		if (!duplicates.isEmpty() || !missing.isEmpty() || !stale.isEmpty()) {
			throw new GradleException(
				"Fabric GameTest entrypoint mismatch: duplicates=${duplicates.sort()}, missing=${missing}, stale=${stale}"
			)
		}
	}
}

tasks.named("check") {
	dependsOn(tasks.named("verifyGameTestEntrypoints"))
}
